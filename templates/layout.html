
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ titulo }} - Biblioteca Universitaria</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="{{ url_for('inicio') }}">
            Biblioteca Universitaria
        </a>

        <div class="navbar-nav">
            <a class="nav-item nav-link" href="{{ url_for('inicio') }}">
                Inicio
            </a>

            <a class="nav-item nav-link" href="{{ url_for('catalogo') }}">
                Catálogo
            </a>

            <a class="nav-item nav-link" href="{{ url_for('servicios') }}">
                Servicios
            </a>

            <a class="nav-item nav-link" href="{{ url_for('contacto') }}">
                Contacto
            </a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
